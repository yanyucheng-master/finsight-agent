[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-agent"
version = "0.1.0"
description = "FinSight Agent —— 可验证的上市公司财务风险研究智能体"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary (competition prototype)" }
dependencies = [
  # 上限按主版本约束，避免新环境装到不兼容的大版本（开发环境实测版本：fastapi 0.162 / pydantic 2.14 / httpx 0.28）
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5"]

[project.scripts]
finsight = "finsight.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["finsight*"]

[tool.setuptools.package-data]
finsight = ["web/**/*", "knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 单项测试超过 300 秒视为失败并打印堆栈（需要 pytest-timeout；用于定位“完整测试长时间不结束”）
timeout = 300
markers = [
  "snapshots: tests that require real data snapshots under data/snapshots",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# 采集器需在裸 Python 3.8+ 上运行，保留 typing.Optional 等写法
"finsight/data/collector.py" = ["UP"]
